name: uppy
version: 1.0.0
description: APM project for uppy
author: Alexander Niebuhr
targets:
- copilot
- claude
- codex
- gemini
- opencode
dependencies:
  mcp:
  - name: chrome-devtools
    registry: false
    transport: stdio
    command: aubx
    args:
    - chrome-devtools-mcp
    - --autoConnect
    - --channel=beta
includes: auto
scripts: {}
